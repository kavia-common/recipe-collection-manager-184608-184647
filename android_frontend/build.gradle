plugins {
    // No plugins at root; use task delegation to subprojects that use DCL
}

// Helper to check if a task exists before depending on it
def taskExists(String path) {
    try {
        return tasks.findByPath(path) != null
    } catch (Throwable ignored) {
        return false
    }
}

// Delegate common lifecycle tasks so CI tools can invoke them at root
tasks.register("assemble") {
    group = "build"
    description = "Assemble app module (debug)"
    dependsOn(":app:assembleDebug")
}

tasks.register("build") {
    group = "build"
    description = "Build app module (debug)"
    dependsOn(":app:assembleDebug")
}

tasks.register("check") {
    group = "verification"
    description = "Run checks across modules (delegated)"
    // Prefer :app:check if it exists, otherwise assembleDebug as a fallback
    if (taskExists(":app:check")) {
        dependsOn(":app:check")
    } else {
        dependsOn(":app:assembleDebug")
    }
}

tasks.register("lint") {
    group = "verification"
    description = "Run Android lint on app module (if available)"
    if (taskExists(":app:lint")) {
        dependsOn(":app:lint")
    } else {
        // Fallback so the task exists and succeeds
        dependsOn(":app:assembleDebug")
    }
}
