plugins {
    // No plugins at root; use task delegation to subprojects that use DCL
}

def firstExistingTask(List<String> candidates) {
    for (String path : candidates) {
        try {
            if (gradle?.parent == null) { /* single build */ }
            if (tasks.findByPath(path) != null) return path
        } catch (Throwable ignored) { }
    }
    return null
}

// Delegate common lifecycle tasks so CI tools can invoke them at root
tasks.register("assemble") {
    group = "build"
    description = "Assemble app module using first available task"
    def target = firstExistingTask([":app:assemble", ":app:build", ":app:bundle", ":app:package"])
    if (target != null) {
        dependsOn(target)
    }
}

tasks.register("build") {
    group = "build"
    description = "Build app module using first available task"
    def target = firstExistingTask([":app:build", ":app:assemble", ":app:bundle"])
    if (target != null) {
        dependsOn(target)
    }
}

tasks.register("check") {
    group = "verification"
    description = "Run checks across modules (delegated if available)"
    def target = firstExistingTask([":app:check", ":app:test", ":app:build"])
    if (target != null) {
        dependsOn(target)
    }
}

tasks.register("lint") {
    group = "verification"
    description = "Run Android lint on app module (if available)"
    def target = firstExistingTask([":app:lint", ":app:lintDebug", ":app:lintVitalRelease"])
    if (target != null) {
        dependsOn(target)
    } else {
        // Leave task noop if no lint tasks exist
        doLast {
            logger.lifecycle("No lint tasks found in :app; skipping lint.")
        }
    }
}
